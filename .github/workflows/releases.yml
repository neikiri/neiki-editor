name: Create Missing Releases
'on':
  workflow_dispatch: null
permissions:
  contents: write
jobs:
  create-releases:
    name: Create Missing Releases
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create missing GitHub Releases
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
        run: |
          set -e

          REPO="${{ github.repository }}"

          echo "Fetching tags..."
          git fetch --tags --force

          echo "Processing tags..."

          for TAG in $(git tag --sort=version:refname); do
            echo ""
            echo "Checking tag: $TAG"

            if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
              echo "✔ Release already exists"
              continue
            fi

            echo "Finding changelog entry..."

            CHANGELOG=$(awk "
              /^## \\[$TAG\\]/ {
                found=1
              }
              /^## \\[/ && found && !/^## \\[$TAG\\]/ {
                exit
              }
              found {
                print
              }
            " CHANGELOG.md)

            if [ -z "$CHANGELOG" ]; then
              echo "⚠ No changelog entry found for $TAG"
              CHANGELOG=$(printf "## [%s]\nNo changelog entry available." "$TAG")
            fi

            PREVIOUS_TAG=$(git tag --sort=version:refname | awk -v tag="$TAG" '
                $0 == tag {print prev; exit}
                {prev=$0}
              ')

              if [ -n "$PREVIOUS_TAG" ]; then
                CHANGELOG=$(printf "%s\n\n**Full Changelog**: https://github.com/%s/compare/%s...%s" \
                  "$CHANGELOG" "$REPO" "$PREVIOUS_TAG" "$TAG")
              else
                CHANGELOG=$(printf "%s\n\n**Full Changelog**: https://github.com/%s/commits/%s" \
                  "$CHANGELOG" "$REPO" "$TAG")
              fi
            echo "Creating release $TAG..."

            gh release create "$TAG" \
              --repo "$REPO" \
              --title "$TAG" \
              --notes "$CHANGELOG"

            echo "✔ Release created"
          done

          echo ""
          echo "Done."
